apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sync.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  edc-api-key: {{ .Values.secrets.edcApiKey | quote }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | quote }}
  keycloak-password: {{ .Values.secrets.keycloakPassword | quote }}
