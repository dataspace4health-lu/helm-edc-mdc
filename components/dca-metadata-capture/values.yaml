# -----------------------------------------------------------------------
# Global security – allow non-standard (bitnamilegacy) container images
# -----------------------------------------------------------------------
global:
  security:
    allowInsecureImages: true

# Controls whether the Keycloak realm JSON ConfigMap is embedded in the
# chart itself (true) or managed externally via kubectl (false).
# Because the realm JSON exceeds Helm's value-size limits the Makefile
# always creates the ConfigMap with kubectl; set this to false.
createRealmConfigMap: false

# -----------------------------------------------------------------------
# Keycloak dependency (Bitnami chart)
# -----------------------------------------------------------------------
keycloak:
  enabled: true
  image:
    registry: bitnamilegacy
    repository: keycloak
    tag: 26.3.3-debian-12-r0
  auth:
    adminUser: admin
    adminPassword: "xfsc4Ntt!"
  extraEnvVars:
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm"
    - name: PROXY_ADDRESS_FORWARDING
      value: "true"
    - name: KC_HOSTNAME
      value: "https://dataspace4health.local/iam"
  extraVolumeMounts:
    - name: config
      mountPath: "/opt/bitnami/keycloak/data/import/dca-metadata-capture-local-realm.json"
      subPath: "dca-metadata-capture-local-realm.json"
      readOnly: true
  extraVolumes:
    - name: config
      configMap:
        name: keycloak-realm
        items:
          - key: "dca-metadata-capture-local-realm.json"
            path: "dca-metadata-capture-local-realm.json"
  logging:
    level: "INFO"
  production: false
  proxy: edge
  # Keycloak will be accessible at /iam/
  httpRelativePath: "/iam/"
  postgresql:
    enabled: true
    nameOverride: keycloak-postgresql
    image:
      registry: bitnamilegacy
      repository: postgresql
      tag: 16.2.0-debian-12-r8
    auth:
      database: keycloak
      username: keycloak
      password: "xfsc4Ntt!"
      postgresPassword: "xfsc4Ntt!"
    primary:
      persistence:
        size: 5Gi
  ingress:
    enabled: true
    hostname: dataspace4health.local
    annotations:
      kubernetes.io/ingress.class: traefik
    tls: true
    extraTls:
      - hosts:
          - dataspace4health.local
        secretName: dataspace4health.local
