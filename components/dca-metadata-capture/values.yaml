# Default values for dca-metadata-capture.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: dca-metadata-capture
replicaCount: 1

image:
  repository: ds4h-registry:5432/dca-metadata-capture
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.0"

imagePullSecrets: []
nameOverride: ""
# fullnameOverride: "dca-metadata-capture"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  allowPrivilegeEscalation: false

securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: null
      paths:
        - path: /dca
          pathType: Prefix
        - path: /assets
          pathType: Prefix
  # Traefik replacePathRegex middleware: strips /dca prefix before forwarding to the app
  replacePath:
    regex: ^/dca/?(.*)
    replacement: /${1}
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

probes:
  path: /api/health
  initialDelaySeconds: 30
  periodSeconds: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dca-metadata-capture
          topologyKey: "kubernetes.io/hostname"

restartPolicy: Always

# -----------------------------------------------------------------------
# Application configuration
# -----------------------------------------------------------------------
config:
  # Path where config.json is mounted inside the container
  configPath: /config/config.json
  # Runtime environment (production | development)
  environment: production
  # Public URL of the application (used for CORS, redirects, etc.)
  appUrl: https://dataspace4health.local/dca
  # Set to "True" to run initial_data.sql during the Alembic migration step.
  # Safe to leave enabled on every deployment — all inserts use ON CONFLICT DO NOTHING.
  loadInitialData: "True"
  # Set to true to run demo_env_seed.py as an init container.
  # Creates a sample organisation, contacts, applicable legislation and datasets.
  # Intended for non-production / first-time setup. Uses create-or-find logic.
  seedDemoData: true
  # Log format: json (structured) or text
  logFormat: json
  logLevel: INFO
  # Subpath the app is mounted at (passed to uvicorn --root-path so FastAPI
  # generates correct redirect URLs and OpenAPI docs links)
  rootPath: "/dca"

# OpenID Connect / Keycloak settings
oidc:
  # Client ID registered in Keycloak — matches the e2e realm
  clientId: dca-metadata-capture-local
  # Set clientSecret in secrets.oidcClientSecret below
  # Bot / service-account auth (enables Bearer-token access for the sync job).
  # Set to the Keycloak client_id of the machine-to-machine service account.
  # Leave empty to disable service-account authentication.
  botServiceClientId: "bot-mdc-service-client"
  # Audience expected in the bot JWT (defaults to oidc.clientId when empty).
  botServiceAudience: "dca-metadata-capture-local"
  # Local Keycloak realm: dca-metadata-capture-local
  authUrl: https://dataspace4health.local/iam/realms/dca-metadata-capture-local/protocol/openid-connect/auth
  tokenUrl: https://dataspace4health.local/iam/realms/dca-metadata-capture-local/protocol/openid-connect/token
  jwksUrl: https://dataspace4health.local/iam/realms/dca-metadata-capture-local/protocol/openid-connect/certs
  endSessionUrl: https://dataspace4health.local/iam/realms/dca-metadata-capture-local/protocol/openid-connect/logout
  # "False"           → skip TLS verification (dev/test)
  # "/path/to/ca.crt" → path to a CA bundle mounted in the container (production)
  # NOTE: do NOT use "True" — the app passes this value directly to httpx's
  #       verify parameter, so a non-False string is treated as a CA cert file path.
  verify: "False"

# SMTP configuration (for email notifications)
smtp:
  server: smtp.local
  port: "587"
  username: smtp-user
  senderEmail: no-reply@dca-metadata-capture.local

# OpenTelemetry (optional tracing)
otlp:
  url: ""
  token: ""

# Front-office FTPS upload (optional)
frontOffice:
  host: ""
  port: "21"
  user: ""
  uploadPath: ""

# Anti-virus scan API (optional)
avscan:
  apiUrl: ""
  apiKey: ""

# Legilux SPARQL endpoint (optional)
legilux:
  endpoint: https://data.legilux.public.lu/sparqlendpoint

# EUR-Lex Web Service credentials (optional)
eurlex:
  username: ""
  password: ""

# Celery background jobs (optional) – requires a Redis instance
celery:
  enabled: false
  brokerUrl: redis://redis:6379/0
  resultBackend: redis://redis:6379/1
  importDatasetsCronSchedule: "*/5"

# Source instance for dataset syncing (optional)
sourceInstance:
  url: ""
  name: ""
  datasetUrlPattern: "/?datasetId={id}"
  syncUserId: "1"
  oidcIssuerUrl: ""
  serviceAccountClientId: ""

# S3 / object storage (optional)
s3:
  bucket: ""
  endpointUrl: ""
  accessKeyId: ""

# Default access URL for distributions
defaultAccessUrl: ""

# -----------------------------------------------------------------------
# Secrets – override these with proper values or use an external
# secrets manager (e.g. Vault / External Secrets Operator)
# -----------------------------------------------------------------------
secrets:
  # OIDC client secret — matches dca-metadata-capture-local client in Keycloak realm
  oidcClientSecret: "ypctz2GbUYM4qNMg48BRGNfVzgFTINzJ"
  # Session encryption keys (use strong random strings ≥ 32 chars)
  sessionSecretKey: "change-me-session-secret-key"
  sessionEncryptionKey: "change-me-session-encryption-key"
  # SMTP password
  smtpPassword: ""
  # S3 secret access key
  s3SecretAccessKey: ""
  # Source instance service account client secret
  sourceServiceAccountClientSecret: ""
  # EUR-Lex password (duplicated here for Secret injection)
  eurlexPassword: ""

# -----------------------------------------------------------------------
# PostgreSQL dependency (Bitnami chart)
# -----------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    registry: bitnamilegacy
    repository: postgresql
    tag: 16.2.0-debian-12-r8
  auth:
    username: dca
    password: "dca-secret!"
    database: dca-metadata-capture
    postgresPassword: "postgres-secret!"
  primary:
    persistence:
      enabled: true
      size: 5Gi

