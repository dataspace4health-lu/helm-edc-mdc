apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  session-secret-key: {{ .Values.secrets.sessionSecretKey | quote }}
  session-encryption-key: {{ .Values.secrets.sessionEncryptionKey | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}
  source-service-account-client-secret: {{ .Values.secrets.sourceServiceAccountClientSecret | quote }}
  eurlex-password: {{ .Values.secrets.eurlexPassword | quote }}
  front-office-password: ""
