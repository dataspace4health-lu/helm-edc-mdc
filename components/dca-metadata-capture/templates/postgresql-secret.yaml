{{/*
  When postgresql.enabled is true the Bitnami subchart manages its own
  Secret.  This template only creates a Secret when using an external
  PostgreSQL instance, to keep the password value consistent with the
  DATABASE_URL helper.
*/}}
{{- if not .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.auth.password | quote }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | quote }}
{{- end }}
